#
# The release pipeline of spec 017, on a v* tag, through latere-ai/ci's
# shared image release stages. The build stage requires that the tag's
# commit passed verify and checks the tag and its CHANGELOG section; the
# version promise is checked against the previous tag; the binaries and the
# archives are built; the two images, lux with luxd inside and lux-stubs,
# are built from those binaries for linux/amd64 and linux/arm64, pushed by
# digest and under no tag, signed, and given a bill of materials and SBOM
# and provenance attestations each; the images are held to the archives'
# bytes; and the deploy archive pins the gateway image by digest. The
# conformance suite then runs against the two digests. Only then does the
# publish stage tag the digests, sign checksums.txt over every attached
# file, and publish the GitHub release with the CHANGELOG section as its
# body. After that the verify stage checks the release from a clean runner,
# the install document is walked against the published artifacts, and the
# next conformance fixture is pushed as the branch conformance/fixture-<tag>
# for the maintainer to merge, because the organization forbids an Action
# from opening a pull request.
#
# Nothing here pushes to the default branch, each job is granted only what
# it or its stage needs, and the image namespace is the repository owner's,
# so a fork's tag publishes under the fork's. Every third-party action of
# the repository's own jobs is pinned by commit with its version in a
# comment.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Everything the release carries, built once from this checkout after
  # the stage's checks. The images are pushed by digest and under no tag, so
  # a run that stops before publish leaves two unreferenced digests and
  # nothing an operator could pull by accident.
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # The gateway image is published as <owner>/lux; luxd is the binary
      # inside it, and prints "luxd <tag> (<commit>, <date>)" for -version.
      # Both images copy a binary build.sh compiled rather than compile one,
      # so no stage of either runs under emulation.
      image_1: '{"name": "lux", "dockerfile": "Dockerfile.release", "version_args": "-version", "version_expect": "luxd {tag} ("}'
      # The stubs have no version flag; the byte check below holds their
      # binary to the build instead.
      image_2: '{"name": "lux-stubs", "dockerfile": "Dockerfile.stubs"}'
      # The version promise holds since the previous tag; then the eight
      # binary archives, and the bare Linux binaries the two Dockerfiles
      # copy, the very bytes the archives carry.
      archives_command: |
        previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo none)
        go run ./tools/release promise -previous "$previous" -tag "$TAG"
        tools/release/build.sh "$TAG" dist
      # Each image's binary, pulled back out of every platform, is the bytes
      # the build produced and the archives carry. Then the deploy archive:
      # the base with the gateway image pinned to this release by digest, the
      # component, the overlays, the bootstrap template, and the example
      # manifests, under one deploy/ directory. Last, the bare binaries leave
      # dist/: the release attaches every file there, and the archives carry
      # the same bytes.
      after_images_command: |
        tools/release/images.sh dist "$IMAGE_1" "$IMAGE_2"
        printf 'images:\n  - name: luxd\n    newName: %s\n    digest: %s\n' "${IMAGE_1%@*}" "${IMAGE_1#*@}" >> deploy/base/kustomization.yaml
        kubectl kustomize deploy/overlays/kind | grep -q "image: ${IMAGE_1}"
        tar -czf "dist/deploy-${TAG}.tar.gz" deploy
        rm dist/luxd_linux_* dist/lux-stubs_linux_*
      runs_on: ubuntu-latest

  # 2. The e2e stack from the two digests rather than from a checkout,
  # and the conformance suite against it. The job also applies the
  # example manifests and reads them back, and drains the run's records,
  # which is the fixture the next release's suite reads.
  conformance:
    name: the conformance suite against the candidate digests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      LUXD_IMAGE: ${{ needs.build.outputs.ref_1 }}@${{ needs.build.outputs.digest_1 }}
      STUBS_IMAGE: ${{ needs.build.outputs.ref_2 }}@${{ needs.build.outputs.digest_2 }}
      LUX_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Start the stubs and the gateway from the digests
        run: |
          docker run -d --name stubs --network host "${STUBS_IMAGE}" \
            -openai-addr 127.0.0.1:9101 -anthropic-addr 127.0.0.1:9102 -gemini-addr 127.0.0.1:9103 -lux-addr 127.0.0.1:9104 \
            -authorizer-addr 127.0.0.1:9105 -issuer-addr 127.0.0.1:9106 -sink-addr 127.0.0.1:9107 -issuer-url http://127.0.0.1:9106
          docker run -d --name luxd --network host \
            -e LUX_PUBLIC_ADDR=127.0.0.1:8080 -e LUX_INTERNAL_ADDR=127.0.0.1:8081 -e LUX_PUBLIC_URL="${LUX_URL}" \
            -e LUX_SECRETS_KEK="$(head -c 32 /dev/urandom | base64 | tr -d '\n')" \
            -e LUX_OIDC_ISSUERS=http://127.0.0.1:9106 -e LUX_OIDC_INSECURE_ISSUERS=http://127.0.0.1:9106 \
            -e LUX_AUTHORIZER_URL=http://127.0.0.1:9105 -e LUX_AUTHORIZER_TOKEN=stub-authorizer-token \
            -e LUX_EVENTS_URL=http://127.0.0.1:9107 -e LUX_EVENTS_SECRET=stub-sink-secret \
            -e LUX_UPSTREAM_ALLOW_PRIVATE=1 -e LUX_HEALTH_INTERVAL=5s \
            "${LUXD_IMAGE}" serve
          for _ in $(seq 1 100); do curl -fsS -o /dev/null http://127.0.0.1:8081/readyz && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:8081/readyz
          docker run -d --name luxd-check --network host --env-file <(docker inspect luxd --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^LUX_') \
            "${LUXD_IMAGE}" check
          docker wait luxd-check | grep -qx 0 || { docker logs luxd-check; exit 1; }
          docker logs luxd-check
      # The stubs document the suite reads at LUX_TEST_STUBS_URL, served
      # from a file, since the binary gives every stub a listener of its
      # own and no document of them.
      - name: Serve the stubs document
        run: |
          mkdir -p out/stubs
          cat > out/stubs/index.html <<'EOF'
          {"providers":{"openai":"http://127.0.0.1:9101","anthropic":"http://127.0.0.1:9102","gemini":"http://127.0.0.1:9103","lux":"http://127.0.0.1:9104"},
           "authorizer":"http://127.0.0.1:9105","issuer":"http://127.0.0.1:9106","sink":"http://127.0.0.1:9107","credential":"stub-credential"}
          EOF
          (cd out/stubs && nohup python3 -m http.server 9110 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in $(seq 1 50); do curl -fsS -o /dev/null http://127.0.0.1:9110/ && break; sleep 0.2; done
      - name: Apply the example manifests as the fixture's objects
        id: token
        run: |
          token=$(curl -fsS -X POST http://127.0.0.1:9106/mint -H 'Content-Type: application/json' -d '{"sub":"dev"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          mkdir -p out/examples
          for f in deploy/examples/*.yaml; do
            sed -e '/^  valueFrom:$/,/^    env: STUB_DEV_KEY$/d' "$f" > "out/examples/$(basename "$f")"
          done
          go run ./cmd/lux -url "${LUX_URL}" -token "$token" apply \
            -f out/examples/provider-openai.yaml -f out/examples/provider-anthropic.yaml -f out/examples/provider-gemini.yaml -f out/examples/provider-lux.yaml \
            -f out/examples/budget-dev.yaml \
            -f out/examples/model-stub-openai.yaml -f out/examples/model-stub-anthropic.yaml -f out/examples/model-stub-gemini.yaml -f out/examples/model-stub-lux.yaml \
            > out/applied.json
          go run ./cmd/lux -url "${LUX_URL}" -token "$token" apply -f out/examples/key-dev.yaml | jq -r .status.value > out/key
          echo "::add-mask::$(cat out/key)"
      - name: TestContract against the candidate
        env:
          LUX_TEST_URL: ${{ env.LUX_URL }}
          LUX_TEST_TOKEN: ${{ steps.token.outputs.token }}
          LUX_TEST_ISSUER_URL: http://127.0.0.1:9106
          LUX_TEST_STUBS_URL: http://127.0.0.1:9110
        run: go test ./test/conformance -run '^TestContract$' -count=1 -v -timeout 20m
      # One request through a door, so the run's records hold at least
      # one; then the resolved manifests read back, and the records
      # drained, as the next release's fixture directory.
      - name: The fixture for the next release
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          key=$(cat out/key)
          for _ in $(seq 1 30); do
            curl -sS "${LUX_URL}/openai/v1/chat/completions" -H "Authorization: Bearer $key" -H 'Content-Type: application/json' \
              -d '{"model":"stub-openai","messages":[{"role":"user","content":"hello"}]}' | grep -q '"choices"' && break
            sleep 2
          done
          dir="out/fixture/${GITHUB_REF_NAME}"
          mkdir -p "$dir"
          # The suite before this step may have spent the control plane's
          # rate for the minute; --retry waits out its 429 by Retry-After.
          for pair in provider:openai budget:dev model:stub-openai key:dev; do
            kind=${pair%%:*}; name=${pair#*:}
            curl -fsS --retry 5 "${LUX_URL}/v1/${kind}s/${name}" -H "Authorization: Bearer $TOKEN" | jq . > "$dir/${kind}.json"
          done
          curl -fsS --retry 5 "${LUX_URL}/v1/requests?limit=1000" -H "Authorization: Bearer $TOKEN" | jq -c '.items[]' > "$dir/records.ndjson"
          [ -s "$dir/records.ndjson" ] || { echo "the run produced no record" >&2; exit 1; }
          ls -l "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture
          path: out/fixture/
          if-no-files-found: error
          retention-days: 7
      # The same directory as one archive, which the publish stage attaches
      # and lists in checksums.txt with the rest; the stage attaches files,
      # not directories.
      - name: The fixture as the archive the release attaches
        run: |
          mkdir -p out/release
          tar -czf "out/release/fixture-${GITHUB_REF_NAME}.tar.gz" -C out/fixture .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-archive
          path: out/release/
          if-no-files-found: error
          retention-days: 7
      - name: The gateway's log, for a failed run
        if: failure()
        run: docker logs luxd; docker logs stubs

  # 3. Only now do the digests get the :<tag> reference, and the release is
  # published with every file the build wrote and the fixture archive the
  # conformance run produced, checksums.txt over all of them signed, and
  # the CHANGELOG section as its body.
  publish:
    needs: [build, conformance]
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      artifacts: fixture-archive
      runs_on: ubuntu-latest

  # 4. From a clean runner with no checkout: every asset downloaded, the
  # signature over checksums.txt and the same check naming another
  # repository refused, every asset against checksums.txt, both images'
  # signatures and attestations, and the body against the CHANGELOG
  # section at the tag.
  verify:
    needs: publish
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: |
        lux
        lux-stubs
      runs_on: ubuntu-latest

  # 5. The install document against the published artifacts: luxd from
  # its archive for part 1, the image by tag and the deploy archive
  # unpacked for part 2, the lux command from its archive for both,
  # walked by the same runner the verify workflow uses against a
  # checkout. The stubs stand in for the issuer and the provider, as a
  # process on the runner for part 1 and as a Pod applied from the job,
  # never from the deploy tree, for part 2.
  install-release:
    name: the install document against the published artifacts
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      OWNER: ${{ needs.build.outputs.owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # luxd and lux come from their release archives, part 1's server
      # and both parts' command. The release archives no lux-stubs, so
      # its binary is copied out of the published stub image the cluster
      # runs, the same bytes, for the stub provider part 1 reaches.
      - name: The published artifacts, and nothing from the checkout but the document and its runner
        run: |
          mkdir -p work "$RUNNER_TEMP/bin" && cd work
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" -p "deploy-${GITHUB_REF_NAME}.tar.gz" \
            -p "lux_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -p "luxd_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
          tar -xzf "deploy-${GITHUB_REF_NAME}.tar.gz"
          tar -xzf "lux_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/bin"
          tar -xzf "luxd_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/bin"
          docker pull "${REGISTRY}/${OWNER}/lux:${GITHUB_REF_NAME}"
          docker pull "${REGISTRY}/${OWNER}/lux-stubs:${GITHUB_REF_NAME}"
          id=$(docker create "${REGISTRY}/${OWNER}/lux-stubs:${GITHUB_REF_NAME}")
          docker cp "$id:/usr/local/bin/lux-stubs" "$RUNNER_TEMP/lux-stubs"
          docker rm "$id" >/dev/null
      - name: The cluster and the stubs
        run: |
          cd work
          ../tools/docs/stubs-in-cluster.sh "${REGISTRY}/${OWNER}/lux-stubs:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${OWNER}/lux:${GITHUB_REF_NAME}" "${REGISTRY}/${OWNER}/lux-stubs:${GITHUB_REF_NAME}"
      - name: The stub provider on the runner, for part 1
        run: |
          cd work
          ../tools/docs/stubs-local.sh "$RUNNER_TEMP/lux-stubs"
      - name: Walk the document
        env:
          LUX_INSTALL_BIN: ${{ runner.temp }}/bin/luxd
          LUX_INSTALL_IMAGE: ${{ env.REGISTRY }}/${{ needs.build.outputs.owner }}/lux:${{ github.ref_name }}
          LUX_INSTALL_MANIFESTS: deploy
        run: |
          cd work
          PATH="$RUNNER_TEMP/bin:$PATH" ../tools/docs/run-blocks.sh ../docs/install.md
      - name: The cluster's state and the local logs, for a failed run
        if: failure()
        run: kubectl -n lux get all; kubectl -n lux describe pod -l app.kubernetes.io/name=luxd; kubectl -n lux logs deploy/luxd --tail=200; tail -n 200 work/luxd.log work/lux-stubs.log || true

  # 6. The next fixture directory, as the branch conformance/fixture-<tag>
  # and never a push to the default branch: what the conformance run
  # produced, attached to the release already as fixture-<tag>.tar.gz by
  # publish. The job pushes the branch and stops. It opens no pull
  # request because the organization forbids an Action from creating
  # one, so the call failed on every release with the branch already
  # pushed; the maintainer merges the branch by hand. A tag's workflow
  # that could write to the default branch could write anything to it,
  # and the one thing this job produces is a directory the maintainer can
  # read in a minute.
  fixture:
    name: push the fixture branch
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixture
          path: test/conformance/testdata/previous
      - name: Commit the directory on conformance/fixture-<tag> and push that branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "conformance/fixture-${GITHUB_REF_NAME}"
          git add "test/conformance/testdata/previous/${GITHUB_REF_NAME}"
          git commit -m "conformance: fixture ${GITHUB_REF_NAME}" -m "The resolved manifests and the archived records the release's conformance run produced, for the fixture group of the next release."
          git push origin "HEAD:refs/heads/conformance/fixture-${GITHUB_REF_NAME}"
