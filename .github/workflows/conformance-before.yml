# The conformance suite of spec 021 run against the base commit of a change.
# The tree as pushed runs it through the shared gate (see the `conformance`
# suite of .lateregate.yaml); this workflow holds only the comparison that
# needs the commit the change came from.
name: conformance-before

# A push or pull request that changes only markdown outside the exceptions
# starts no run, because no build or test reads it. The exceptions are specs/,
# whose error tables and criteria the suite holds to the code; docs/, which
# tests hold to the code; skills/, which a test holds to the CLI;
# SECURITY.md, which the threat-model test reads; and the markdown inside
# any testdata directory, which tests load. `lateregate release` runs
# the whole bar before every tag. A tag is never filtered by paths.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "**"
      - "!**.md"
      - "specs/**"
      - "docs/**"
      - "skills/**"
      - "SECURITY.md"
      - "**/testdata/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "specs/**"
      - "docs/**"
      - "skills/**"
      - "SECURITY.md"
      - "**/testdata/**"
  workflow_dispatch:

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The conformance suite against the commit the change came from, the base
  # of the pull request or the previous commit of a push, on one runner with
  # one toolchain, so a change under the doors that moves a byte a caller
  # sees is red here before it is a bug report. The tree as pushed runs the
  # same suite in the `conformance` entry of .lateregate.yaml; this half
  # stays a workflow of its own because it needs the base commit, which a
  # suite is not given. Spec 021's swap of the codec glue for the bridge is
  # the first such change; the job stays for the next one. A push with no
  # previous commit has nothing to compare with.
  conformance-before:
    name: the conformance suite against the base commit
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: before
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous commit to compare with"
            exit 0
          fi
          git worktree add ../before "$BASE"
          cd ../before
          go test -tags=integration -run '^TestE2EConformance$' -v ./test/e2e/
