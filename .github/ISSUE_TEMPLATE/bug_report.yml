name: Bug report
description: Something Lux does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See
        [SECURITY.md](https://github.com/latere-ai/lux/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I applied a Model with two targets and a fallback, and a request ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The shortest sequence that shows it. The manifest, the `lux` or
        `curl` command with its output, is ideal. Redact keys and tokens.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or image digest, from `GET /version`.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: dialect
    attributes:
      label: Dialect
      description: The API shape the failing request was sent in.
      options:
        - OpenAI
        - Anthropic
        - Gemini
        - Lux
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from luxd, and the `trace_id` of the failing
        request if you have it. Redact keys, tokens, and hostnames you would
        rather not publish.
      render: text
