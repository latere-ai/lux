openapi: 3.1.0
info:
  title: Lux API
  version: v1
  description: "The control plane of Lux under /v1: apply a Provider, Model, Key, or Budget by name with PUT, read one by id or name, list with limit and cursor, delete, and rotate a Key. Every request body is a manifest of lux.latere.ai/v1beta1 in JSON or YAML; every response is JSON; every refusal is one envelope with one code from the error table in x-lux-errors. Every URL is under LUX_PUBLIC_URL."
paths:
  /v1/providers:
    get:
      operationId: listProviders
      summary: List Providers under the authorizer's filter, paged by limit and cursor.
      x-lux-action: provider.list
      parameters:
      - $ref: "#/components/parameters/label"
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/providers/{name}:
    put:
      operationId: applyProvider
      summary: Create the Provider when no object of the name exists, update it when one does; 201 on create, 200 on update. Apply is by name and only by name.
      x-lux-action: provider.create or provider.update
      parameters:
      - name: name
        in: path
        required: true
        description: The Provider's name on an apply; its name or its prv_ id otherwise.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/ifNoneMatch"
      requestBody:
        required: true
        description: A Provider manifest, or one without apiVersion, kind, and metadata.name, which the route supplies.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Provider"
          application/yaml:
            schema:
              $ref: "#/components/schemas/Provider"
      responses:
        "200":
          description: The object as updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "201":
          description: The object as created; a Key carries status.value once.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: readProvider
      summary: Read one Provider by id or name, with its status.
      x-lux-action: provider.read
      parameters:
      - name: name
        in: path
        required: true
        description: The Provider's name on an apply; its name or its prv_ id otherwise.
        schema:
          type: string
      responses:
        "200":
          description: The object.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProvider
      summary: Delete one Provider by id or name; 204 with no body.
      x-lux-action: provider.delete
      parameters:
      - name: name
        in: path
        required: true
        description: The Provider's name on an apply; its name or its prv_ id otherwise.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      responses:
        "204":
          description: Deleted.
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/models:
    get:
      operationId: listModels
      summary: List Models under the authorizer's filter, paged by limit and cursor.
      x-lux-action: model.list
      parameters:
      - $ref: "#/components/parameters/label"
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/source"
      - $ref: "#/components/parameters/provider"
      responses:
        "200":
          description: One page.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/models/{name}:
    put:
      operationId: applyModel
      summary: Create the Model when no object of the name exists, update it when one does; 201 on create, 200 on update. Apply is by name and only by name.
      x-lux-action: model.create or model.update
      parameters:
      - name: name
        in: path
        required: true
        description: The Model's name on an apply; its name or its mdl_ id otherwise. A Model name may carry /, so the route matches any number of segments, percent-encoded or not.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/ifNoneMatch"
      requestBody:
        required: true
        description: A Model manifest, or one without apiVersion, kind, and metadata.name, which the route supplies.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Model"
          application/yaml:
            schema:
              $ref: "#/components/schemas/Model"
      responses:
        "200":
          description: The object as updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "201":
          description: The object as created; a Key carries status.value once.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: readModel
      summary: Read one Model by id or name, with its status.
      x-lux-action: model.read
      parameters:
      - name: name
        in: path
        required: true
        description: The Model's name on an apply; its name or its mdl_ id otherwise. A Model name may carry /, so the route matches any number of segments, percent-encoded or not.
        schema:
          type: string
      responses:
        "200":
          description: The object.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteModel
      summary: Delete one Model by id or name; 204 with no body.
      x-lux-action: model.delete
      parameters:
      - name: name
        in: path
        required: true
        description: The Model's name on an apply; its name or its mdl_ id otherwise. A Model name may carry /, so the route matches any number of segments, percent-encoded or not.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      responses:
        "204":
          description: Deleted.
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/keys:
    get:
      operationId: listKeys
      summary: List Keys under the authorizer's filter, paged by limit and cursor.
      x-lux-action: key.list
      parameters:
      - $ref: "#/components/parameters/label"
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/keys/{name}:
    put:
      operationId: applyKey
      summary: Create the Key when no object of the name exists, update it when one does; 201 on create, 200 on update. Apply is by name and only by name.
      x-lux-action: key.create or key.update
      parameters:
      - name: name
        in: path
        required: true
        description: The Key's name on an apply; its name or its key_ id otherwise.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/ifNoneMatch"
      requestBody:
        required: true
        description: A Key manifest, or one without apiVersion, kind, and metadata.name, which the route supplies.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Key"
          application/yaml:
            schema:
              $ref: "#/components/schemas/Key"
      responses:
        "200":
          description: The object as updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "201":
          description: The object as created; a Key carries status.value once.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: readKey
      summary: Read one Key by id or name, with its status.
      x-lux-action: key.read
      parameters:
      - name: name
        in: path
        required: true
        description: The Key's name on an apply; its name or its key_ id otherwise.
        schema:
          type: string
      responses:
        "200":
          description: The object.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteKey
      summary: Delete one Key by id or name; 204 with no body.
      x-lux-action: key.delete
      parameters:
      - name: name
        in: path
        required: true
        description: The Key's name on an apply; its name or its key_ id otherwise.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      responses:
        "204":
          description: Deleted.
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/keys/{name}/rotate:
    post:
      operationId: rotateKey
      summary: Mint a new value for the Key, keeping its id, name, spec, owner, and windows; 200 with status.value. A repeat is a second rotation.
      x-lux-action: key.update
      parameters:
      - name: name
        in: path
        required: true
        description: The Key's name on an apply; its name or its key_ id otherwise.
        schema:
          type: string
      responses:
        "200":
          description: The Key with its new value.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/budgets:
    get:
      operationId: listBudgets
      summary: List Budgets under the authorizer's filter, paged by limit and cursor.
      x-lux-action: budget.list
      parameters:
      - $ref: "#/components/parameters/label"
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetList"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/budgets/{name}:
    put:
      operationId: applyBudget
      summary: Create the Budget when no object of the name exists, update it when one does; 201 on create, 200 on update. Apply is by name and only by name.
      x-lux-action: budget.create or budget.update
      parameters:
      - name: name
        in: path
        required: true
        description: The Budget's name on an apply; its name or its bud_ id otherwise.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/ifNoneMatch"
      requestBody:
        required: true
        description: A Budget manifest, or one without apiVersion, kind, and metadata.name, which the route supplies.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Budget"
          application/yaml:
            schema:
              $ref: "#/components/schemas/Budget"
      responses:
        "200":
          description: The object as updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "201":
          description: The object as created; a Key carries status.value once.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: readBudget
      summary: Read one Budget by id or name, with its status.
      x-lux-action: budget.read
      parameters:
      - name: name
        in: path
        required: true
        description: The Budget's name on an apply; its name or its bud_ id otherwise.
        schema:
          type: string
      responses:
        "200":
          description: The object.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteBudget
      summary: Delete one Budget by id or name; 204 with no body.
      x-lux-action: budget.delete
      parameters:
      - name: name
        in: path
        required: true
        description: The Budget's name on an apply; its name or its bud_ id otherwise.
        schema:
          type: string
      - $ref: "#/components/parameters/ifMatch"
      responses:
        "204":
          description: Deleted.
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/usage:
    get:
      operationId: readUsage
      summary: Usage aggregated over a range, grouped by at most three dimensions and bucketed by an interval; unpaged, and no row sums two currencies. A filter outside the authorizer's own is an empty items.
      x-lux-action: usage.read
      parameters:
      - $ref: "#/components/parameters/from"
      - $ref: "#/components/parameters/to"
      - $ref: "#/components/parameters/by"
      - $ref: "#/components/parameters/interval"
      - $ref: "#/components/parameters/usageKey"
      - $ref: "#/components/parameters/usageModel"
      - $ref: "#/components/parameters/usageProvider"
      - $ref: "#/components/parameters/usageOwner"
      - $ref: "#/components/parameters/usageLabel"
      responses:
        "200":
          description: The rows.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageList"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/requests:
    get:
      operationId: listRequests
      summary: Usage records over a range, newest first, paged by limit and cursor, with the record set that answered beside them.
      x-lux-action: usage.read
      parameters:
      - $ref: "#/components/parameters/from"
      - $ref: "#/components/parameters/to"
      - $ref: "#/components/parameters/usageKey"
      - $ref: "#/components/parameters/usageModel"
      - $ref: "#/components/parameters/usageProvider"
      - $ref: "#/components/parameters/usageOwner"
      - $ref: "#/components/parameters/usageLabel"
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/error"
      - $ref: "#/components/parameters/stream"
      - $ref: "#/components/parameters/recordLimit"
      - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of records.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/self:
    get:
      operationId: readSelf
      summary: The caller's identity, who decides permission, and what this replica remembers granting the subject.
      x-lux-action: none
      responses:
        "200":
          description: The caller.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Self"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/openapi.json:
    get:
      operationId: readOpenAPI
      summary: This document as JSON; no bearer.
      x-lux-action: none
      parameters: []
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                type: object
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    security: []
  /.well-known/lux:
    get:
      operationId: readWellKnown
      summary: "The server's identity: the build, the API and the doors under LUX_PUBLIC_URL, the issuers, the audience, and the mode; no bearer."
      x-lux-action: none
      parameters: []
      responses:
        "200":
          description: The server.
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnown"
        default:
          description: "A refusal: one code of x-lux-errors with its fixed sentence."
          headers:
            Lux-Request-Id:
              $ref: "#/components/headers/Lux-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token from an issuer in LUX_OIDC_ISSUERS with aud containing LUX_OIDC_AUDIENCE.
  parameters:
    label:
      name: label
      in: query
      required: false
      description: k=v, repeatable; every pair must match.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    owner:
      name: owner
      in: query
      required: false
      description: A rendered subject; intersected with the authorizer's filter, so one outside it is an empty list.
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: Page size, default 50, at most 200; above is invalid_field.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: The previous page's next_cursor, opaque; one from another kind or filter is invalid_field.
      schema:
        type: string
    source:
      name: source
      in: query
      required: false
      description: Models by source.
      schema:
        type: string
        enum:
        - declared
        - discovered
    provider:
      name: provider
      in: query
      required: false
      description: Models with a target on the Provider, by name or prv_ id.
      schema:
        type: string
    from:
      name: from
      in: query
      required: false
      description: The start of the range, RFC 3339; default 24 hours before to. The range is at most 90 days.
      schema:
        type: string
        format: date-time
    to:
      name: to
      in: query
      required: false
      description: The end of the range, RFC 3339; default now. It must be after from.
      schema:
        type: string
        format: date-time
    by:
      name: by
      in: query
      required: false
      description: "The dimensions to group by, comma separated, at most three: key, model, provider, owner, door, status, or label:<name>. None is one total row."
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    interval:
      name: interval
      in: query
      required: false
      description: The bucket width; none is one row per group over the whole range.
      schema:
        type: string
        enum:
        - none
        - hour
        - day
        - month
        default: none
    usageKey:
      name: key
      in: query
      required: false
      description: A Key by name or key_ id, repeatable; a filter, not a grouping. A name that names no Key is an empty items, and a key_ id keeps working after the Key is deleted.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    usageModel:
      name: model
      in: query
      required: false
      description: A Model by name or mdl_ id, repeatable.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    usageProvider:
      name: provider
      in: query
      required: false
      description: A Provider by name or prv_ id, repeatable.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    usageOwner:
      name: owner
      in: query
      required: false
      description: A rendered subject, repeatable; intersected with the authorizer's filter, so one outside it is an empty items.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    usageLabel:
      name: label
      in: query
      required: false
      description: name=value over the Key's labels, repeatable; every pair must match.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    status:
      name: status
      in: query
      required: false
      description: Records of one outcome.
      schema:
        type: string
        enum:
        - ok
        - refused
        - failed
    error:
      name: error
      in: query
      required: false
      description: Records carrying one error code of x-lux-errors.
      schema:
        type: string
    stream:
      name: stream
      in: query
      required: false
      description: Streamed records alone, or unstreamed alone.
      schema:
        type: boolean
    recordLimit:
      name: limit
      in: query
      required: false
      description: Page size, default 50, at most 1000; above is invalid_field.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    ifMatch:
      name: If-Match
      in: header
      required: false
      description: "* for the object must exist, or one quoted integer for exactly this version; a mismatch is conflict, a free name not_found. Anything else is invalid_field."
      schema:
        type: string
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: "* for create only; a taken name is already_exists. Anything else is invalid_field."
      schema:
        type: string
  headers:
    Lux-Request-Id:
      description: The server's id of this request, req_ and a ULID; a caller's own is replaced.
      schema:
        type: string
    ETag:
      description: The object's status.version as one quoted integer, the value If-Match takes.
      schema:
        type: string
    RateLimit-Limit:
      description: The subject's requests a minute on this replica.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left in the window.
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until the window is full again.
      schema:
        type: integer
