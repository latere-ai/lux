# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/lux/
  exempt:
    # Spec 018's suite: TestContract is in the untagged run and skips
    # without LUX_TEST_URL, so the package's whole body runs against a
    # server the gate does not start and measures no statements here
    # (spec 015).
    test/conformance: a package whose whole body runs against a server the gate does not start
    # Spec 010's Postgres store: every statement runs against a database
    # the gate does not start, so the untagged run measures its pure
    # parts alone and the postgres tier of spec 015 runs the rest, its
    # conformance suite included, against a service container.
    internal/store/postgres: a store whose body runs against a database the gate does not start; the postgres tier measures it
    internal/store/postgres/pgtest: the postgres tier's database helper, compiled into tagged test binaries alone

spec:
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The suite runs with only the Go toolchain on PATH. luxd forks no binary
# of its own: it speaks HTTP to the providers, the issuers, and the
# authorizer, and the stubs of spec 015 are Go processes the suite starts
# itself.
hermetic:
  allow: []

tempdir:
  allow: {}

# Spec 001's dependency rule: the build list of ./cmd/luxd reaches the
# standard library, latere.ai/x/pkg, the Postgres driver of spec 010, and
# the OpenTelemetry SDK, and no provider SDK; a dialect is translated by
# latere.ai/x/pkg/llmdialect rather than by a vendor client. Until those
# specs land the list is the standard library and pkg, so a new dependency
# is a decision recorded here, one row per role package as the roles land.
depcheck:
  packages:
    latere.ai/x/lux/cmd/luxd:
      decision: >-
        the gateway reaches latere.ai/x/pkg and the standard library, the
        YAML decoder of spec 003, and the OpenTelemetry SDK with what it
        pulls in, which joined with spec 006 through the shared verifier's
        tracing transport; the Postgres driver joins with spec 010's
        Postgres store, and nothing else does without a row here (spec 001)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        go.opentelemetry.io: >-
          the OpenTelemetry SDK spec 001 admits, reached through
          latere.ai/x/pkg/otel by the verifier of spec 006 and the traces
          of spec 019
        google.golang.org/grpc: the OTLP exporters' transport, a dependency of the OpenTelemetry SDK
        google.golang.org/protobuf: the OTLP wire format, a dependency of the OpenTelemetry SDK
        google.golang.org/genproto: the OTLP status types, a dependency of the OpenTelemetry SDK
        golang.org/x: the Go project's extended library, a dependency of the OpenTelemetry SDK and gRPC
        github.com/grpc-ecosystem/grpc-gateway: the OTLP HTTP exporters' dependency
        github.com/go-logr: the OpenTelemetry SDK's logging seam
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
        github.com/felixge/httpsnoop: the response recorder of the SDK's HTTP instrumentation
        github.com/cespare/xxhash: a hash the OpenTelemetry SDK's metric pipeline uses
        github.com/cenkalti/backoff: the OTLP exporters' retry
        github.com/goccy/go-yaml: >-
          the YAML decoder spec 003 names, reached through manifest by the
          file mode of spec 010, which decodes a directory of manifests at
          start
        # The Postgres store of spec 010: the driver, its pool, and the
        # three small packages it reads a connection string with, and the
        # migrator pgxmigrate runs, whose pgx5 database driver reads the
        # error codes. Only internal/store/postgres imports any of them.
        github.com/jackc/pgx: the Postgres driver of spec 010's store, reached through internal/store/postgres alone
        github.com/jackc/puddle: the driver's connection pool
        github.com/jackc/pgpassfile: the driver's reading of a password file a connection string may name
        github.com/jackc/pgservicefile: the driver's reading of a service file a connection string may name
        github.com/jackc/pgerrcode: the error codes the migrator's pgx5 driver reads
        github.com/golang-migrate/migrate: the migrator of spec 010's store, run through latere.ai/x/pkg/pgxmigrate over the embedded migrations
    # Spec 014's build list for the agent client: the standard library,
    # latere.ai/x/pkg/httpjson for the error envelope, this module's
    # client for the /v1 routes, this module's manifest and manifest/v1,
    # which pull in the one YAML library, and this module's
    # internal/tunnel/wire and internal/tunnel/agent, which lux serve
    # holds its session through and which reach the standard library and
    # that same envelope. No HTTP client library, no command
    # line framework, no multiplexer, no WebSocket codec, no OpenTelemetry
    # SDK, no identity library, no store driver, no provider SDK: the
    # command is a person's process and exports nothing.
    latere.ai/x/lux/cmd/lux:
      decision: >-
        the lux command reaches the standard library, the error envelope
        of latere.ai/x/pkg/httpjson, this module's client for the /v1
        routes, this module's manifest packages with the YAML library
        they decode with, and this module's internal/tunnel/wire and
        internal/tunnel/agent for lux serve's session, whose transport is net/http's HTTP/2 and whose frames are
        encoding/json, and nothing else without a row here (spec 014)
      allow:
        latere.ai/x/pkg/httpjson: the error envelope every refusal is decoded from (spec 014)
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson, reached through the envelope
        github.com/goccy/go-yaml: >-
          the YAML decoder spec 003 names, reached through manifest by lux
          apply, which decodes every document with the server's own Decode;
          its encoder renders -o yaml
    # Spec 015's stubs binary: it mounts the stub issuer and the stub
    # authorizer of latere.ai/x/pkg rather than a second reading of either
    # contract, and its sink verifies with internal/events, which carries
    # the delivery client's instrumented transport and, through it, the
    # OpenTelemetry SDK luxd already admits. It ships as a test image and
    # never as an installation, so no provider SDK and no driver joins it
    # either.
    latere.ai/x/lux/cmd/lux-stubs:
      decision: >-
        the stubs reach latere.ai/x/pkg for the issuer and the authorizer
        they mount and the standard library, and the sink's events.Verify
        brings internal/events with the OpenTelemetry SDK behind its
        delivery client; nothing else joins without a row here (spec 015)
      allow:
        latere.ai/x/pkg: the stub issuer, the stub authorizer, and the shared library they are built on (spec 015)
        go.opentelemetry.io: the OpenTelemetry SDK behind internal/events' delivery client, reached through latere.ai/x/pkg/otel
        google.golang.org/grpc: the OTLP exporters' transport, a dependency of the OpenTelemetry SDK
        google.golang.org/protobuf: the OTLP wire format, a dependency of the OpenTelemetry SDK
        google.golang.org/genproto: the OTLP status types, a dependency of the OpenTelemetry SDK
        golang.org/x: the Go project's extended library, a dependency of the OpenTelemetry SDK and gRPC
        github.com/grpc-ecosystem/grpc-gateway: the OTLP HTTP exporters' dependency
        github.com/go-logr: the OpenTelemetry SDK's logging seam
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
        github.com/felixge/httpsnoop: the response recorder of the SDK's HTTP instrumentation
        github.com/cespare/xxhash: a hash the OpenTelemetry SDK's metric pipeline uses
        github.com/cenkalti/backoff: the OTLP exporters' retry

license:
  spdx: Apache-2.0
  holder: Latere AI

identity:
  role: core
  audience: lux
  config_prefix: LUX
  api_group: lux.latere.ai
  # The default audience a deployment verifies unless it configures its
  # own.
  reached_by: self-hosted
  # Access is by role: the roles rule runs, and it is one way once set.
  roles_only: true
