# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/lux/

spec:
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The suite runs with only the Go toolchain on PATH. luxd forks no binary
# of its own: it speaks HTTP to the providers, the issuers, and the
# authorizer, and the stubs of spec 015 are Go processes the suite starts
# itself.
hermetic:
  allow: []

tempdir:
  allow: {}

# Spec 001's dependency rule: the build list of ./cmd/luxd reaches the
# standard library, latere.ai/x/pkg, the Postgres driver of spec 010, and
# the OpenTelemetry SDK, and no provider SDK; a dialect is translated by
# latere.ai/x/pkg/llmdialect rather than by a vendor client. Until those
# specs land the list is the standard library and pkg, so a new dependency
# is a decision recorded here, one row per role package as the roles land.
depcheck:
  packages:
    latere.ai/x/lux/cmd/luxd:
      decision: >-
        the gateway reaches latere.ai/x/pkg and the standard library, the
        YAML decoder of spec 003, and the OpenTelemetry SDK with what it
        pulls in, which joined with spec 006 through the shared verifier's
        tracing transport; the Postgres driver joins with spec 010's
        Postgres store, and nothing else does without a row here (spec 001)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        go.opentelemetry.io: >-
          the OpenTelemetry SDK spec 001 admits, reached through
          latere.ai/x/pkg/otel by the verifier of spec 006 and the traces
          of spec 019
        google.golang.org/grpc: the OTLP exporters' transport, a dependency of the OpenTelemetry SDK
        google.golang.org/protobuf: the OTLP wire format, a dependency of the OpenTelemetry SDK
        google.golang.org/genproto: the OTLP status types, a dependency of the OpenTelemetry SDK
        golang.org/x: the Go project's extended library, a dependency of the OpenTelemetry SDK and gRPC
        github.com/grpc-ecosystem/grpc-gateway: the OTLP HTTP exporters' dependency
        github.com/go-logr: the OpenTelemetry SDK's logging seam
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
        github.com/felixge/httpsnoop: the response recorder of the SDK's HTTP instrumentation
        github.com/cespare/xxhash: a hash the OpenTelemetry SDK's metric pipeline uses
        github.com/cenkalti/backoff: the OTLP exporters' retry
        github.com/goccy/go-yaml: >-
          the YAML decoder spec 003 names, reached through manifest by the
          file mode of spec 010, which decodes a directory of manifests at
          start

license:
  spdx: Apache-2.0
  holder: Latere AI

identity:
  role: core
  audience: lux
  config_prefix: LUX
  api_group: lux.latere.ai
  # The default audience a deployment verifies unless it configures its
  # own.
  reached_by: self-hosted
