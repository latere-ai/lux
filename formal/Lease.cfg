\* Renewals that run late by less than the margin the lease leaves between a
\* renewal and its expiry, as the Go constants set it: no two replicas act
\* at once. Two leases fit in Horizon seconds.
CONSTANTS
  Replicas = {r1, r2}
  Horizon = 40
  MaxLate <- SafeLate
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Exclusive
