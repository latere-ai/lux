#
# The core's one rule at the platform origin: /v1/models on api.latere.ai,
# forwarded without a rewrite, because the core serves its whole listener
# under LUX_BASE_PATH (lux spec 034). There is no tls block and no issuer
# annotation: the host's certificate is the origin's, which arcad's Ingress
# holds for every service routed under api.latere.ai.
#
# A completion streams for as long as the model writes, so the read and send
# timeouts are an hour and the response is not buffered, which would hold a
# stream's events until it ended. The body limit is the core's own
# LUX_MAX_BODY_BYTES default, 10 MiB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: luxd
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.latere.ai
      http:
        paths:
          - path: /v1/models
            pathType: Prefix
            backend:
              service:
                name: luxd
                port:
                  name: public
