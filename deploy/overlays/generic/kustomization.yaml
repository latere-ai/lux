#
# Any cluster (spec 017): the base's two replicas over a Postgres store,
# behind an ingress the installation adds. luxd.env names the public URL
# and the issuer; the store's URL is one of the four values in
# deploy/bootstrap's Secret. A gateway from this overlay applies the
# store's schema at its first start and refuses to start without a
# database that answers, so the Secret's LUX_DB_URL is filled before the
# apply; luxd check's store, migrations, and db conns rows read the
# cluster before a first install. An installation that
# autoscales adds `components: [../../components/hpa]` and drops the
# replica count the base sets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lux
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: luxd
    envs:
      - luxd.env
