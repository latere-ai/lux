# The gemini dialect: the base URL carries the API's own version prefix.
apiVersion: lux.latere.ai/v1beta1
kind: Provider
metadata:
  name: gemini
spec:
  dialect: gemini
  baseURL: https://generativelanguage.googleapis.com/v1beta
  credential:
    valueFrom:
      env: GEMINI_API_KEY
  discovery:
    mode: none          # the catalog's Models are declared and priced; auto would add the vendor's other models unpriced
