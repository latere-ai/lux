apiVersion: lux.latere.ai/v1beta1
kind: Model
metadata:
  name: openai/gpt-5.4-nano
spec:
  targets:
    - provider: openai
      model: gpt-5.4-nano
      weight: 100
      priority: 0
  fallback: never
  pricing:
    currency: USD
    per: 1000000
    input: "0.2"
    output: "1.25"
    cachedInput: "0.02"
  modalities:
    input: [text, image, file]
  contextWindow: 400000
  maxOutputTokens: 128000
