apiVersion: lux.latere.ai/v1beta1
kind: Model
metadata:
  name: openai/gpt-5.1
spec:
  targets:
    - provider: openai
      model: gpt-5.1
      weight: 100
      priority: 0
  fallback: never
  pricing:
    currency: USD
    per: 1000000
    input: "1.25"
    output: "10"
    cachedInput: "0.125"
  modalities:
    input: [text, image, file]
  contextWindow: 400000
  maxOutputTokens: 128000
