apiVersion: lux.latere.ai/v1beta1
kind: Model
metadata:
  name: openai/gpt-5-pro
spec:
  targets:
    - provider: openai
      model: gpt-5-pro
      weight: 100
      priority: 0
  fallback: never
  pricing:
    currency: USD
    per: 1000000
    input: "15"
    output: "120"
  modalities:
    input: [text, image, file]
  contextWindow: 400000
  maxOutputTokens: 128000
