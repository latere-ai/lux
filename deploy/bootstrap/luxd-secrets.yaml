#
# The four values no manifest in a repository should carry (spec 017),
# filled once and applied by hand into the installation's namespace:
#
#	kubectl apply -n lux -f luxd-secrets.yaml
#
# A blank value is unset, so leave blank what the installation does not
# use: LUX_DB_URL on a laptop cluster with the memory store,
# LUX_AUTHORIZER_TOKEN under the built-in owner policy, LUX_EVENTS_SECRET
# with no sink. The key encryption key is one to eight 32-byte keys in
# standard base64, comma separated; the first wraps every new credential
# and every one is tried to open a stored one, so a rotation is
# prepending a new key, running `luxd rewrap`, and dropping the old one
# (specs/005-providers.md). One key:
#
#	head -c 32 /dev/urandom | base64
#
# docs/install.md creates the same Secret from the command line for a
# first installation; this file is the declarative form for the next.
apiVersion: v1
kind: Secret
metadata:
  name: luxd-secrets
  labels:
    app.kubernetes.io/name: luxd
type: Opaque
stringData:
  # specs/005-providers.md: wraps every Provider credential at rest.
  LUX_SECRETS_KEK: ""
  # specs/006-identity.md: the bearer luxd sends your authorizer.
  LUX_AUTHORIZER_TOKEN: ""
  # specs/012-request-log-and-events.md: the HMAC key of every event.
  LUX_EVENTS_SECRET: ""
  # specs/010-state.md: postgres://user:password@host:5432/lux?sslmode=require
  LUX_DB_URL: ""
