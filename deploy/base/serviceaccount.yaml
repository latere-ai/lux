#
# luxd calls no Kubernetes API, so the account has no Role, no
# RoleBinding, and no token mounted into the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: luxd
  labels:
    app.kubernetes.io/name: luxd
automountServiceAccountToken: false
