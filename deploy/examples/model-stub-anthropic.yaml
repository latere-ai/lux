# One routable name over the anthropic stub; see model-stub-openai.yaml.
apiVersion: lux.latere.ai/v1beta1
kind: Model
metadata:
  name: stub-anthropic
spec:
  targets:
    - provider: anthropic
      model: stub-anthropic
  contextWindow: 200000
  maxOutputTokens: 4096
  pricing:
    input: "3"
    output: "15"
