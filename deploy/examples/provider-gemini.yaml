# The gemini dialect against its stub: the base URL carries this API's
# own version prefix. See provider-openai.yaml for the rest.
apiVersion: lux.latere.ai/v1beta1
kind: Provider
metadata:
  name: gemini
spec:
  dialect: gemini
  baseURL: http://127.0.0.1:9103/v1beta
  credential:
    value: stub-credential
  discovery:
    mode: none          # the Models beside this file are declared; auto would list the stub's stub-gemini too
