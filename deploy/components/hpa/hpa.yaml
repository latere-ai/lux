#
# The bounds are the connection arithmetic of spec 017: maxReplicas times
# LUX_DB_MAX_CONNS plus one must stay under the store's max_connections
# less its reserved slots, which `luxd check`'s db conns row reports.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: luxd
  labels:
    app.kubernetes.io/name: luxd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: luxd
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
