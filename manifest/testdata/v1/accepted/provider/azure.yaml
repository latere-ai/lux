apiVersion: lux.latere.ai/v1beta1
kind: Provider
metadata:
  name: azure
  labels:
    tier: paid
    region: eu
spec:
  dialect: openai
  baseURL: https://azure.example.com/openai/v1
  credential:
    value: az-live-...
    header: api-key                    # an OpenAI-compatible upstream that wants its own header
    scheme: raw
  discovery:
    mode: none
  health:
    mode: passive
  timeout: 2m
  concurrency: 8
