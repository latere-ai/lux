apiVersion: lux.latere.ai/v1beta1
kind: Provider
metadata:
  name: keeps-nothing
spec:
  dialect: openai                      # an upstream whose terms keep nothing of any request
  baseURL: https://inference.example.com/v1
  credential:
    value: sk-inference-example
  zeroRetention: {}                    # a request on a Key with spec.zeroRetention is sent as any request is
  discovery:
    mode: none
